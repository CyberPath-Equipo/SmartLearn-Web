<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="CyberPath S.A.S.">
  <title>Subtemas | Smart Learn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
  <header id="main-header" class="header-top" role="banner">
    <h1 id="pageTitle">Subtemas</h1>

    <div class="header-right">
      <button class="boton-imagen" aria-label="Ir al perfil de usuario" onclick="perfilUser()"> <!--mejor usamos un botón para la navegación por teclado -->
        <img src="../images/perfilUsuarioSinFondo.png" alt="Perfil del usuario" height="50" class="perfilUsuario">
      </button>
      <button class="btn-ghost" onclick="logout()">Cerrar sesión</button>
      <span id="temaNombre" class="tag-info"></span>
      <button class="btn-ghost2" onclick="window.history.back()">← Volver</button>
      <button id="btnAddSubtema" class="btn-primary" onclick="mostrarFormAdd()">+ Nuevo Subtema</button>
    </div>
</header>

<main class="container" role="main">
  <section class="card">

    <!-- Formulario agregar subtema -->
    <div id="formBox" class="hidden" role="region">
      <form id="subtemaForm">

        <label for="nombreSubtema">Nombre del subtema</label>
        <input id="nombreSubtema" name="nombreSubtema" type="text" placeholder="Nombre del subtema" required />

        <div class="form-actions">
          <button type="submit" class="btn-primary">Guardar</button>
          <button type="button" class="btn-secondary" onclick="ocultarForm()">Cancelar</button>
        </div>

      </form>
    </div>

    <!-- Formulario para editar subtema -->
    <div id="formBoxEdit" class="hidden" role="region">
      <form id="editSubtemaForm">

        <input type="hidden" id="editId" />

        <label for="editNombre">Nombre</label>
        <input id="editNombre" name="editNombre" type="text" required />

        <div class="form-actions">
          <button type="submit" class="btn-primary">Actualizar</button>
          <button type="button" class="btn-secondary" onclick="ocultarFormEdit()">Cancelar</button>
        </div>

      </form>
    </div>

    <!-- Tabla de subtemas -->
    <div id="tableContainer">
      <table id="elementosTable" class="full-width">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Nombre</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody id="subtemasBody">
        </tbody>
      </table>
    </div>

    <!-- Mensajes -->
    <div id="messages" role="status" aria-live="polite" class="hidden"></div>

  </section>
</main>

  <footer role="contentinfo">
    <div class="footer-content">
      <div class="footer-col">
        <h3>CyberPath S.A.S.</h3>
        <p>Desarrollado por <i>CyberPath</i> &copy; 2026</p>
        <p><a href="mailto:cyberpathcontacto@gmail.com">cyberpathcontacto@gmail.com</a></p>
      </div>

      <div class="footer-col">
        <h3>Recursos</h3>
        <p><a href="avisoPrivacidad.html">Aviso de privacidad</a></p>
        <p><a href="smartLearn.html">¿Qué es Smart Learn?</a></p>
      </div>

      <div class="footer-col">
        <p><strong>Redes Sociales</strong></p>
        <div class="social-icons">
          <a href="https://instagram.com/cyberpath_oficial/" target="_blank" aria-label="Síguenos en Instagram">
            <img src="../images/icon_instagram.png" width="50" alt="Logo de Instagram">
          </a>
          <a href="https://www.youtube.com/@CyberPath_oficial" target="_blank" aria-label="Visita nuestro canal de YouTube">
            <img src="../images/icon_youtube.png" width="70" alt="Logo de YouTube">
          </a>
        </div>
      </div>
    </div>
    <p class="footer-copy">Hecho en México · Smart Learn · CyberPath S.A.S.</p>
  </footer>

<script src="../scripts/script.js"></script> <!-- fuentes compartidas -->
<script src="../scripts/subtema.js"></script>

</body>
</html>
