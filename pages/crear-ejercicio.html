<body>
    <header id="main-header" class="header-top" role="banner">
        <h1 id="pageTitle">Ejercicio</h1>
        <div class="header-right">
            <button class="boton-imagen" aria-label="Ir al perfil de usuario" onclick="perfilUser()"> <!--mejor usamos un botón para la navegación por teclado -->

            </button>
            <!--     <img src="../images/perfilUsuarioSinFondo.png" alt="Perfil del usuario" aria-label="Ir al perfil de usuario" height="50" class="perfilUsuario" style="margin-top: -10px;" onclick="perfilUser()">-->

            <span id="subtemaNombre" class="tag-info"></span>
            <button class="btn-ghost2" onclick="window.history.back()">← Volver</button>
        </div>
    </header>

    <main class="container" role="main">
        <section class="card">
            <h2>Datos del ejercicio</h2>
            <form id="ejercicioForm">
                <div class="form-group">
                    <label for="nombreEjercicio">Nombre del ejercicio</label>
                    <input type="text"
                           id="nombreEjercicio"
                           name="nombreEjercicio"
                           placeholder="Ej. Ejercicio de variables"
                           required aria-required="true"
                           autocomplete="off"> <!-- o no? -->
                </div>
                <button type="submit" class="btn-primary full-width">
                    Guardar ejercicio
                </button>
            </form>
        </section>

    </main>
