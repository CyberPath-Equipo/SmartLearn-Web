<body>

    <header class="header">
        <h1 id="pageTitle">Ejercicio</h1>

        <div class="header-right">
            <button class="btn-ghost" onclick="window.history.back()">← Volver</button>
            <span id="subtemaNombre" class="tag-info"></span>
            <button class="btn-ghost" onclick="logout()">Cerrar sesión</button>

        </div>
    </header>

<main class="container">

    <section class="card">
        <h2>Datos del ejercicio</h2>

        <form id="ejercicioForm">

            <div class="form-group">
                <label for="nombreEjercicio">Nombre del ejercicio</label>
                <input
                    type="text"
                    id="nombreEjercicio"
                    placeholder="Ej. Ejercicio de variables"
                    required
                >
            </div>

            <button type="submit" class="btn-primary full-width">
                Guardar ejercicio
            </button>

        </form>
    </section>
