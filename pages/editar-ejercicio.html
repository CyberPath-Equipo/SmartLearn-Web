<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Editar ejercicio | Smart Learn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header id="main-header" class="header-top" role="banner">
        <h1 id="pageTitle">Editar - Ejercicio</h1>
        <div class="header-right">
            <button class="boton-imagen" aria-label="Ir al perfil de usuario" onclick="perfilUser()"> <!--mejor usamos un botón para la navegación por teclado -->
                <img src="../images/perfilUsuarioSinFondo.png" alt="Perfil del usuario" height="50" class="perfilUsuario">
            </button>
            <!--     <img src="../images/perfilUsuarioSinFondo.png" alt="Perfil del usuario" aria-label="Ir al perfil de usuario" height="50" class="perfilUsuario" style="margin-top: -10px;" onclick="perfilUser()">-->
            <button class="btn-ghost" onclick="logout()">Cerrar sesión</button>
            <span id="subtemaNombre" class="tag-info"></span>
            <button class="btn-ghost2" onclick="window.history.back()">← Volver</button>
        </div>
    </header>

    <main class="container" role="main">
        <section class="card">
            <h2>Edicion de teoria</h2>
            <form id="formEditarEjercicio">
                <input type="hidden" id="idEjercicio">

                <div class="campo">
                    <label for="nombre">Nombre del ejercicio</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="acciones">
                    <button type="submit" class="peligro">Guardar cambios</button>
                    <button type="button" class="btn-secondary" onclick="volver()">Cancelar</button>
                </div>
            </form>

            <h2 style="margin-top: 50px;">Preguntas</h2>
            <div id="tableContainer">
                <table  id="elementosTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Enunciado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="ejerciciosBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    
    <footer role="contentinfo">
        <div class="footer-content">
            <div class="footer-col">
                <h3>CyberPath S.A.S.</h3>
                <p>Desarrollado por <i>CyberPath</i> &copy; 2026</p>
                <p><a href="mailto:cyberpathcontacto@gmail.com">cyberpathcontacto@gmail.com</a></p>
            </div>

            <div class="footer-col">
                <h3>Recursos</h3>
                <p><a href="avisoPrivacidad.html">Aviso de privacidad</a></p>
                <p><a href="smartLearn.html">¿Qué es Smart Learn?</a></p>
            </div>

            <div class="footer-col">
                <p><strong>Redes Sociales</strong></p>
                <div class="social-icons">
                    <a href="https://instagram.com/cyberpath_oficial/" target="_blank" aria-label="Síguenos en Instagram">
                        <img src="../images/icon_instagram.png" width="50" alt="Logo de Instagram">
                    </a>
                    <a href="https://www.youtube.com/@CyberPath_oficial" target="_blank" aria-label="Visita nuestro canal de YouTube">
                        <img src="../images/icon_youtube.png" width="70" alt="Logo de YouTube">
                    </a>
                </div>
            </div>
        </div>
        <p class="footer-copy">Hecho en México · Smart Learn · CyberPath S.A.S.</p>
    </footer>
</body>
