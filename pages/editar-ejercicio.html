<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar ejercicio</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header class="header">
        <h1 id="pageTitle">Editar- Ejercicio</h1>

        <div class="header-right">
            <button class="btn-ghost" onclick="window.history.back()">← Volver</button>
            <span id="subtemaNombre" class="tag-info"></span>
            <button class="btn-ghost" onclick="logout()">Cerrar sesión</button>
    <img src="../images/perfilUsuarioSinFondo.png" alt="Perfil del usuario" height="50" class="perfilUsuario" style="margin-top: -10px;" onclick="perfilUser()">
        </div>
    </header>

    <main class="container" role="main">
        <section class="card">
            <h2>Edicion de teoria</h2>
            <form id="formEditarEjercicio">
                <input type="hidden" id="idEjercicio">

                <div class="campo">
                    <label for="nombre">Nombre del ejercicio</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="acciones">
                    <button type="submit" class="peligro">Guardar cambios</button>
                    <button type="button" class="btn-secondary" onclick="volver()">Cancelar</button>
                </div>
            </form>

            <h2 style="margin-top: 50px;">Preguntas</h2>
            <div id="tableContainer">
                <table  id="elementosTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Enunciado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="ejerciciosBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
