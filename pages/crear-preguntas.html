<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear preguntas - SmartLearn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>

<header class="header">
    <h1 id="pageTitle">Preguntas- Ejercicio</h1>

    <div class="header-right">
        <button class="btn-ghost" onclick="window.history.back()">← Volver</button>
        <span id="subtemaNombre" class="tag-info"></span>
        <button class="btn-ghost" onclick="logout()">Cerrar sesión</button>
        <img src="../images/perfilUsuarioSinFondo.png" alt="Perfil del usuario" height="50" class="perfilUsuario" style="margin-top: -10px;" onclick="perfilUser()">
    </div>
</header>

<main class="container">

    <!-- ========================= -->
    <!--  NOMBRE DEL EJERCICIO     -->
    <!-- ========================= -->
    <section class="card">
        <h2 id="nombreEjercicioTitulo">Nombre del ejercicio</h2>
        <p class="info-text">
            Crea las preguntas y opciones correspondientes a este ejercicio.
        </p>
    </section>

    <!-- ========================= -->
    <!--  CREAR / EDITAR PREGUNTA  -->
    <!-- ========================= -->
    <section class="card">
        <h2>Pregunta</h2>

        <div class="form-group">
            <label for="enunciadoPregunta">Enunciado</label>
            <textarea
                id="enunciadoPregunta"
                rows="3"
                placeholder="Escribe la pregunta aquí..."
                required
            ></textarea>
        </div>
    </section>

    <!-- ========================= -->
    <!--  OPCIONES                 -->
    <!-- ========================= -->
    <section class="card">
        <h2>Opciones</h2>

        <div id="opcionesContainer">
            <!-- JS insertará opciones dinámicamente -->
        </div>

        <button class="btn-secondary" onclick="agregarOpcion()">
            + Agregar opción
        </button>
    </section>

    <!-- ========================= -->
    <!--  ACCIONES                 -->
    <!-- ========================= -->
    <section class="card action-buttons">

        <button class="btn-primary" onclick="guardarPregunta()">
            Guardar pregunta
        </button>

        <button class="btn-secondary" onclick="nuevaPregunta()">
            Añadir otra pregunta
        </button>

        <button class="peligro" onclick="volverATeoria()">
            Regresar a teoría
        </button>

    </section>

</main>

<script src="../scripts/crear-preguntas.js"></script>
<script src="../scripts/script.js"></script>

</body>
</html>
