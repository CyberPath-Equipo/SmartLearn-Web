<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="CyberPath S.A.S.">
    <title>Teoría | Smart Learn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header id="main-header" class="header-top" role="banner">
        <h1 id="pageTitle">Teoría - Subtema</h1>
        <div class="header-right">
            <button class="boton-imagen" aria-label="Ir al perfil de usuario" onclick="perfilUser()"> <!--mejor usamos un botón para la navegación por teclado -->
                <img src="../images/perfilUsuarioSinFondo.png" alt="Perfil del usuario" height="50" class="perfilUsuario">
            </button>
            <button class="btn-ghost" onclick="logout()">Cerrar sesión</button>
            <span id="subtemaNombre" class="tag-info"></span>
            <button class="btn-ghost2" onclick="window.history.back()">← Volver</button>
        </div>
    </header>

    <main class="container" role="main">
        <!-- ================= CREAR TEORÍA ================= -->
        <section id="crearTeoriaSection" class="card" style="display:none;">
            <h2>Crear teoría</h2>

            <form id="teoriaForm">
                <div class="form-group">
                    <label for="tituloIngresado">Título de la teoría</label>
                    <input type="text" id="tituloIngresado" required>
                </div>

                <div class="form-group">
                    <label for="contenidoIngresado">Contenido</label>
                    <textarea id="contenidoIngresado" rows="6" required></textarea>
                </div>

                <button type="submit" class="btn-primary full-width">
                    Crear teoría
                </button>
            </form>
        </section>

        <!-- ================= EDITAR TEORÍA ================= -->
        <section id="editarTeoriaForm" class="card" style="display:none;">
            <h2>Editar teoría</h2>

            <form id="editarTeoriaForm">

                <div class="form-group">
                    <label for="editarTitulo">Título de la teoría</label>
                    <input
                        type="text"
                        id="editarTitulo"
                        name="editarTitulo"
                        placeholder="Título de la teoría"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editarContenido">Contenido</label>
                    <textarea
                        id="editarContenido"
                        name="editarContenido"
                        rows="8"
                        placeholder="Edita el contenido de la teoría..."
                        required
                    ></textarea>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn-primary">
                        Guardar cambios
                    </button>

                    <button
                        type="button"
                        class="btn-secondary"
                        onclick="cargarTeoria()"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="peligro"
                        onclick="eliminarTeoria()"
                    >
                        Eliminar teoría
                    </button>
                </div>

            </form>
        </section>


        <!-- ================= TEORÍA + EJERCICIOS ================= -->
        <section id="teoriaSection" class="card" style="display:none;">
            <h2 id="tituloTeoriaExistente"></h2>

            <p id="contenidoTeoriaExistente" class="texto-teoria"></p>

            <div class="action-buttons">
                <button class="btn-secondary" onclick="editarTeoria()">Editar teoría</button>
                <button class="peligro" onclick="eliminarTeoria()">Eliminar teoría</button>
            </div>

            <hr style="margin-top: 1%;">

            <!-- ================= EJERCICIOS ================= -->
            <h3>Ejercicios</h3>

            <div id="tableContainer">
                <table  id="elementosTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="ejerciciosBody"></tbody>
                </table>
            </div>

            <div class="action-buttons" style="margin-top:15px;">
                <button class="btn-secondary" onclick="crearEjercicio()" style="margin-top: 2%;">
                    + Crear ejercicio
                </button>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <div class="footer-content">
            <div class="footer-col">
                <h3>CyberPath S.A.S.</h3>
                <p>Desarrollado por <i>CyberPath</i> &copy; 2026</p>
                <p><a href="mailto:cyberpathcontacto@gmail.com">cyberpathcontacto@gmail.com</a></p>
            </div>

            <div class="footer-col">
                <h3>Recursos</h3>
                <p><a href="avisoPrivacidad.html">Aviso de privacidad</a></p>
                <p><a href="smartLearn.html">¿Qué es Smart Learn?</a></p>
            </div>

            <div class="footer-col">
                <p><strong>Redes Sociales</strong></p>
                <div class="social-icons">
                    <a href="https://instagram.com/cyberpath_oficial/" target="_blank" aria-label="Síguenos en Instagram">
                        <img src="../images/icon_instagram.png" width="50" alt="Logo de Instagram">
                    </a>
                    <a href="https://www.youtube.com/@CyberPath_oficial" target="_blank" aria-label="Visita nuestro canal de YouTube">
                        <img src="../images/icon_youtube.png" width="70" alt="Logo de YouTube">
                    </a>
                </div>
            </div>
        </div>
        <p class="footer-copy">Hecho en México · Smart Learn · CyberPath S.A.S.</p>
    </footer>
</body>

<script src="../scripts/teoria.js"></script>
<script src="../scripts/script.js"></script>

</html>
