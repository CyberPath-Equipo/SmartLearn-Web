<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="CyberPath S.A.S.">
    <title>Gestión de Materias | Smart Learn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
    <header class="dashboard-header" role="banner">
        <div class="dashboard-header-left">
            <button class="boton-imagen" aria-label="Ir a página principal" onclick="paginaPrincipal()"> 
                <img src="../images/Blanco_sin_fondo_Recortada_Smart_Learn_logo.png" alt="imagen SL" width="87" height="60">
            </button>
            <h1 id="pageTitle">Gestión de Materias</h1>
        </div>
        <div class="dashboard-header-right">
            <button class="boton-imagen profile-btn" aria-label="Ir al perfil de usuario" onclick="perfilUser()"> 
                <img src="../images/perfilUsuarioSinFondo.png" alt="Perfil del usuario" height="50">
            </button>
            <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
        </div>
    </header>

    <main role="main">
        <section class="card dashboard-card">
            <div class="topbar">
                <h2>Materias disponibles</h2>
                <button id="btnAdd" class="btn-primary" onclick="mostrarFormAdd()">+ Nueva materia</button>
                <div id="formBox" class="hidden">
                    <form id="subjectForm">
                        <input id="nombreMateria" type="text" placeholder="Nombre de la materia" required />
                        <input id="descripcion" type="text" placeholder="Descripción de la materia" />
                        <button type="submit" class="btn-primary">Guardar</button>
                    </form>
                </div>
                <div id="formBoxEdit" class="hidden">
                    <form id="editForm">
                        <input id="nombreMateriaEdit" type="text" placeholder="Nombre de la materia" required />
                        <input id="descripcionEdit" type="text" placeholder="Descripción de la materia" />
                        <button type="submit" class="btn-primary">Guardar</button>
                    </form>
                </div>
            </div>

            <!-- Tabla que se llenará desde JavaScript -->
            <div id="tableContainer">
                <table id="materiasTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody id="materiasBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <div class="footer-content">
            <div class="footer-col">
                <h3>CyberPath S.A.S.</h3>
                <p>Desarrollado por <i>CyberPath</i> &copy; 2026</p>
                <p><a href="mailto:cyberpathcontacto@gmail.com">cyberpathcontacto@gmail.com</a></p>
            </div>

            <div class="footer-col">
                <h3>Recursos</h3>
                <p><a href="avisoPrivacidad.html">Aviso de privacidad</a></p>
                <p><a href="smartLearn.html">¿Qué es Smart Learn?</a></p>
            </div>

            <div class="footer-col">
                <p><strong>Redes Sociales</strong></p>
                <div class="social-icons">
                    <a href="https://instagram.com/cyberpath_oficial/" target="_blank" aria-label="Síguenos en Instagram">
                        <img src="../images/icon_instagram.png" width="50" alt="Logo de Instagram">
                    </a>
                    <a href="https://www.youtube.com/@CyberPath_oficial" target="_blank" aria-label="Visita nuestro canal de YouTube">
                        <img src="../images/icon_youtube.png" width="70" alt="Logo de YouTube">
                    </a>
                </div>
            </div>
        </div>
        <p class="footer-copy">Hecho en México · Smart Learn · CyberPath S.A.S.</p>
    </footer>

    <script src="../scripts/materias.js"></script>
    <script src="../scripts/script.js"></script>
</body>
</html>
