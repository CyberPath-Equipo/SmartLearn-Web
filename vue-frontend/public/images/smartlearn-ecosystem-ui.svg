<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="560" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172F50"/>
      <stop offset="100%" stop-color="#254CA8"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07ACDA"/>
      <stop offset="100%" stop-color="#005FCC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#091526" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Base Surface -->
  <rect width="560" height="400" rx="24" fill="url(#bgGrad)"/>
  <circle cx="480" cy="60" r="140" fill="#07ACDA" fill-opacity="0.12"/>
  <circle cx="70" cy="340" r="120" fill="#07ACDA" fill-opacity="0.08"/>

  <!-- Subtle architectural grid lines -->
  <path d="M0 80H560M0 160H560M0 240H560M0 320H560" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M140 0V400M280 0V400M420 0V400" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Main Card: Lectura en Voz Alta & TTS -->
  <g filter="url(#cardShadow)">
    <rect x="36" y="34" width="320" height="154" rx="16" fill="#FFFFFF"/>
    <rect x="56" y="54" width="42" height="42" rx="12" fill="#EAF8FC"/>
    <!-- Speaker Icon -->
    <path d="M77 67L71 72H66V78H71L77 83V67Z" stroke="#005FCC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M81.5 71.5C83 73 83 77 81.5 78.5M84.5 68.5C87.5 71.5 87.5 78.5 84.5 81.5" stroke="#07ACDA" stroke-width="2" stroke-linecap="round"/>

    <text x="112" y="71" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Narrador TTS Activo</text>
    <text x="112" y="90" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Lección 01 · Clasificación de números</text>

    <!-- Audio Waveform -->
    <g transform="translate(56, 116)">
      <rect x="0" y="14" width="5" height="16" rx="2.5" fill="#07ACDA"/>
      <rect x="11" y="6" width="5" height="32" rx="2.5" fill="#254CA8"/>
      <rect x="22" y="10" width="5" height="24" rx="2.5" fill="#07ACDA"/>
      <rect x="33" y="2" width="5" height="40" rx="2.5" fill="#254CA8"/>
      <rect x="44" y="8" width="5" height="28" rx="2.5" fill="#07ACDA"/>
      <rect x="55" y="12" width="5" height="20" rx="2.5" fill="#254CA8"/>
      <rect x="66" y="4" width="5" height="36" rx="2.5" fill="#07ACDA"/>
      <rect x="77" y="10" width="5" height="24" rx="2.5" fill="#254CA8"/>
      <rect x="88" y="15" width="5" height="14" rx="2.5" fill="#07ACDA"/>
      <rect x="99" y="7" width="5" height="30" rx="2.5" fill="#254CA8"/>
      <rect x="110" y="12" width="5" height="20" rx="2.5" fill="#DCE5EF"/>
      <rect x="121" y="16" width="5" height="12" rx="2.5" fill="#DCE5EF"/>
      <rect x="132" y="10" width="5" height="24" rx="2.5" fill="#DCE5EF"/>
      <rect x="143" y="14" width="5" height="16" rx="2.5" fill="#DCE5EF"/>
    </g>

    <rect x="234" y="122" width="102" height="32" rx="16" fill="#EDF1FC"/>
    <circle cx="250" cy="138" r="5" fill="#07ACDA"/>
    <text x="262" y="142" fill="#254CA8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">1.0x Fluido</text>
  </g>

  <!-- Top Right Card: Braille Matrix -->
  <g filter="url(#cardShadow)">
    <rect x="376" y="34" width="148" height="154" rx="16" fill="#0F233F" stroke="#07ACDA" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="396" y="64" fill="#EAF8FC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Línea Braille</text>
    <text x="396" y="82" fill="#8AB4D8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Salida táctil</text>

    <!-- Braille Dots Grid -->
    <g transform="translate(402, 100)">
      <!-- Cell 1 -->
      <rect x="0" y="0" width="42" height="64" rx="8" fill="#172F50" stroke="#254CA8"/>
      <circle cx="13" cy="14" r="4" fill="#07ACDA"/>
      <circle cx="29" cy="14" r="4" fill="#07ACDA"/>
      <circle cx="13" cy="32" r="4" fill="#324D70"/>
      <circle cx="29" cy="32" r="4" fill="#07ACDA"/>
      <circle cx="13" cy="50" r="4" fill="#07ACDA"/>
      <circle cx="29" cy="50" r="4" fill="#324D70"/>

      <!-- Cell 2 -->
      <rect x="54" y="0" width="42" height="64" rx="8" fill="#172F50" stroke="#254CA8"/>
      <circle cx="67" cy="14" r="4" fill="#07ACDA"/>
      <circle cx="83" cy="14" r="4" fill="#324D70"/>
      <circle cx="67" cy="32" r="4" fill="#07ACDA"/>
      <circle cx="83" cy="32" r="4" fill="#07ACDA"/>
      <circle cx="67" cy="50" r="4" fill="#324D70"/>
      <circle cx="83" cy="50" r="4" fill="#324D70"/>
    </g>
  </g>

  <!-- Bottom Left Card: Control por Voz -->
  <g filter="url(#cardShadow)">
    <rect x="36" y="210" width="244" height="156" rx="16" fill="#FFFFFF"/>
    <rect x="56" y="230" width="38" height="38" rx="10" fill="#EDF1FC"/>
    <rect x="71" y="238" width="8" height="13" rx="4" stroke="#254CA8" stroke-width="2"/>
    <path d="M67 248C67 252.4 70.6 256 75 256C79.4 256 83 252.4 83 248M75 256V260" stroke="#254CA8" stroke-width="2" stroke-linecap="round"/>

    <text x="106" y="247" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Comando por Voz</text>
    <text x="106" y="264" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Reconocimiento natural</text>

    <rect x="56" y="284" width="204" height="36" rx="10" fill="#F8FAFC" stroke="#DCE5EF"/>
    <text x="70" y="306" fill="#254CA8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">“Abrir ejercicio de Álgebra”</text>

    <circle cx="64" cy="340" r="4" fill="#07ACDA"/>
    <text x="74" y="344" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Respuesta auditiva inmediata</text>
  </g>

  <!-- Bottom Right Card: Seguimiento Académico -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="210" width="224" height="156" rx="16" fill="#FFFFFF"/>
    <text x="322" y="242" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Seguimiento Docente</text>
    <text x="322" y="260" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Progreso accesible en tiempo real</text>

    <!-- Progress Bars -->
    <text x="322" y="288" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Matemáticas I</text>
    <text x="476" y="288" fill="#254CA8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">92%</text>
    <rect x="322" y="295" width="180" height="8" rx="4" fill="#EDF1FC"/>
    <rect x="322" y="295" width="165" height="8" rx="4" fill="url(#cyanGlow)"/>

    <text x="322" y="326" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Comprensión Teórica</text>
    <text x="476" y="326" fill="#07ACDA" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">88%</text>
    <rect x="322" y="333" width="180" height="8" rx="4" fill="#EDF1FC"/>
    <rect x="322" y="333" width="154" height="8" rx="4" fill="#07ACDA"/>
  </g>
</svg>
