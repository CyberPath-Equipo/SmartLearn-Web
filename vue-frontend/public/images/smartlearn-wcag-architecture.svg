<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <defs>
    <linearGradient id="surfaceGrad" x1="0" y1="0" x2="560" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF8FC"/>
      <stop offset="100%" stop-color="#EDF1FC"/>
    </linearGradient>
    <linearGradient id="brandPill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#254CA8"/>
      <stop offset="100%" stop-color="#172F50"/>
    </linearGradient>
    <filter id="elevShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172F50" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="560" height="400" rx="24" fill="url(#surfaceGrad)" stroke="#DCE5EF" stroke-width="2"/>

  <!-- Central Hub Connection Lines -->
  <path d="M280 200L138 106M280 200L422 106M280 200L138 294M280 200L422 294" stroke="#254CA8" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- Top-Left Node: Lector de Pantalla -->
  <g filter="url(#elevShadow)">
    <rect x="38" y="46" width="200" height="112" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/>
    <rect x="56" y="64" width="36" height="36" rx="10" fill="#EAF8FC"/>
    <path d="M74 75L69 79H65V85H69L74 89V75Z" stroke="#005FCC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 78.5C79.5 80 79.5 84 78 85.5" stroke="#07ACDA" stroke-width="2" stroke-linecap="round"/>
    <text x="104" y="80" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">TalkBack &amp; NVDA</text>
    <text x="104" y="96" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Etiquetas ARIA semánticas</text>
    <rect x="56" y="114" width="164" height="26" rx="8" fill="#F8FAFC"/>
    <text x="68" y="131" fill="#254CA8" font-family="monospace" font-size="11" font-weight="600">aria-live="polite" · WCAG</text>
  </g>

  <!-- Top-Right Node: Navegación por Teclado -->
  <g filter="url(#elevShadow)">
    <rect x="322" y="46" width="200" height="112" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/>
    <rect x="340" y="64" width="52" height="36" rx="8" fill="#172F50"/>
    <text x="352" y="86" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700">TAB ⇥</text>
    <text x="404" y="80" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Foco Visible</text>
    <text x="404" y="96" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Atajos sin ratón</text>
    <rect x="340" y="114" width="164" height="26" rx="8" fill="#EDF1FC" stroke="#005FCC" stroke-width="1.5"/>
    <text x="354" y="131" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Anillo de enfoque 3px AA</text>
  </g>

  <!-- Bottom-Left Node: Alto Contraste -->
  <g filter="url(#elevShadow)">
    <rect x="38" y="242" width="200" height="112" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/>
    <rect x="56" y="260" width="36" height="36" rx="10" fill="#172F50"/>
    <circle cx="74" cy="278" r="8" stroke="#07ACDA" stroke-width="2"/>
    <path d="M74 270A8 8 0 0 1 74 286Z" fill="#07ACDA"/>
    <text x="104" y="276" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Alto Contraste</text>
    <text x="104" y="292" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Relación &gt; 7.2:1 AAA</text>
    <rect x="56" y="310" width="76" height="26" rx="6" fill="#172F50"/>
    <text x="69" y="327" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Oscuro</text>
    <rect x="140" y="310" width="80" height="26" rx="6" fill="#EAF8FC" stroke="#07ACDA"/>
    <text x="158" y="327" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Claro</text>
  </g>

  <!-- Bottom-Right Node: Escalabilidad y Movimiento Reducido -->
  <g filter="url(#elevShadow)">
    <rect x="322" y="242" width="200" height="112" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/>
    <rect x="340" y="260" width="36" height="36" rx="10" fill="#EAF8FC"/>
    <text x="347" y="283" fill="#005FCC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">Aa+</text>
    <text x="388" y="276" fill="#172F50" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Diseño Adaptativo</text>
    <text x="388" y="292" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Zoom 200% sin recortes</text>
    <rect x="340" y="310" width="164" height="26" rx="8" fill="#F8FAFC"/>
    <text x="352" y="327" fill="#53657D" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">prefers-reduced-motion</text>
  </g>

  <!-- Center Badge: WCAG 2.2 AA Core -->
  <g filter="url(#elevShadow)">
    <circle cx="280" cy="200" r="52" fill="url(#brandPill)" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="280" cy="200" r="42" stroke="#07ACDA" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="280" y="196" text-anchor="middle" fill="#07ACDA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">WCAG 2.2</text>
    <text x="280" y="214" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">100% Inclusivo</text>
  </g>
</svg>
